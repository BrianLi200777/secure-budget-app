<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ title }} · Secure Budget</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    main { max-width: 360px; margin: 80px auto; background: #fff; padding: 32px;
           border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-size: .9rem; }
    input { width: 100%; padding: 10px; box-sizing: border-box;
            border: 1px solid #ccd; border-radius: 6px; }
    button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px;
             background: #1f6feb; color: #fff; font-size: 1rem; cursor: pointer; }
    .flash { background: #fff4e5; border: 1px solid #f0c36d; padding: 8px 12px;
             border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
    p.switch { text-align: center; font-size: .9rem; }
    main:has(.dashboard) { max-width: 760px; margin-top: 40px; }
    h2 { font-size: 1.1rem; margin: 32px 0 12px; }
    .stats { display: flex; gap: 12px; }
    .stat { flex: 1; background: #f4f6f8; border-radius: 8px; padding: 14px; }
    .stat span { display: block; font-size: .85rem; color: #555; }
    .stat strong { font-size: 1.4rem; }
    .in { color: #1a7f37; }
    .budget { margin-bottom: 14px; font-size: .9rem; }
    .budget-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .budget em { font-style: normal; font-weight: 600; margin-left: 6px; }
    .bar { height: 8px; background: #eaeef2; border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; background: #1a7f37; }
    .fill.near { background: #bf8700; }
    .fill.over { background: #cf222e; }
    em.near { color: #bf8700; }
    em.over { color: #cf222e; }
    form.inline { display: flex; gap: 8px; margin-top: 16px; }
    form.inline select, form.inline input { flex: 1; padding: 10px; border: 1px solid #ccd; border-radius: 6px; }
    form.inline button { width: auto; margin-top: 0; padding: 10px 16px; }
    .edit-budget summary { font-size: .8rem; color: #1f6feb; cursor: pointer; margin-top: 6px; width: fit-content; }
    .edit-budget form.inline { margin-top: 8px; }
    .add-budget { margin-top: 18px; }
    .add-budget summary { font-size: .9rem; }
    .money-input { flex: 1; display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .money-input input { font-weight: normal; }
    form.inline button.secondary { margin-top: 0; }
    .chart { display: flex; align-items: flex-end; gap: 12px; height: 180px; }
    .column { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: .75rem; }
    .column-bar { width: 100%; background: #1f6feb; border-radius: 4px 4px 0 0; min-height: 2px; }
    .column .amount { margin-bottom: 4px; color: #555; }
    .column .label { margin-top: 4px; }
    @media (max-width: 600px) { form.inline, .stats { flex-direction: column; } }
    button.secondary { background: #fff; color: #1f6feb; border: 1px solid #1f6feb; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: .9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .num { text-align: right; }
  </style>
</head>
<body>
  <main>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
